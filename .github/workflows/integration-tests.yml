# Integration tests for the unity_catalog extension: build ONE test binary (BUILD_KIND, default
# release), then run it against a Local (OSS Unity Catalog container) and a Cloud (live Databricks)
# target. Cloud is gated by the `cloud` environment (required reviewer) -- a PR can request it, but
# only an admin releases the secrets. The driver comes from its git pin in pyproject.toml (no
# side-by-side checkout); MainDistribution builds the shipping binary separately.

name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  VCPKG_COMMIT_ID: 84bab45d415d22042bd0b9081aea57f362da3f35
  # Flip release <-> relassert here. Threaded below as $BUILD_KIND in run: and ${{ env.BUILD_KIND }}
  # in with:. (GH quirk: env isn't usable in a job `name:` or job-level `env:`, so job names stay
  # generic and BUILD_DIR is set inline in the run.) NB: relassert is a non-Release build -> it also
  # turns ASAN+UBSAN on; add DISABLE_SANITIZER: "1" if you flip to it and don't want a sanitizer run.
  BUILD_KIND: release

jobs:
  # ---------------------------------------------------------------------------
  # Build ONE binary + extensions; hand them to Local/Cloud as an artifact.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
      GEN: ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      USE_MERGED_VCPKG_MANIFEST: 1
      BUILD_EXTENSION_TEST_DEPS: full
      RUSTC_WRAPPER: sccache # caches both C++ && Rust
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
      DUCKDB_LINKER: mold # use the fast linker (installed below); Release doesn't auto-select it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure OpenSSL for Rust
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          OPENSSL_ROOT_DIR=$PWD/build/$BUILD_KIND/vcpkg_installed/x64-linux
          OPENSSL_DIR=$PWD/build/$BUILD_KIND/vcpkg_installed/x64-linux
          OPENSSL_USE_STATIC_LIBS=true
          EOF

      - name: Install Ninja + mold
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build mold

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Cache vcpkg built packages
        uses: actions/cache@v4
        with:
          path: build/${{ env.BUILD_KIND }}/vcpkg_installed
          # duckdb/vcpkg.json: USE_MERGED_VCPKG_MANIFEST folds duckdb's own vcpkg deps into the manifest.
          key: vcpkg-x64-linux-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'extension_config.cmake', 'duckdb/vcpkg.json') }}
          restore-keys: |
            vcpkg-x64-linux-${{ env.VCPKG_COMMIT_ID }}-
            vcpkg-x64-linux-

      - name: Build
        run: |
          make $BUILD_KIND
          sccache --show-stats || true

      - name: Upload test binary + extensions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_KIND }}
          path: |
            build/${{ env.BUILD_KIND }}/test/unittest
            build/${{ env.BUILD_KIND }}/duckdb
            build/${{ env.BUILD_KIND }}/extension/**/*.duckdb_extension
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Local: OSS Unity Catalog container. No secrets -> runs always.
  # ---------------------------------------------------------------------------
  local:
    name: Local (OSS Unity Catalog)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DUCKTEST_UC_IMAGE: ghcr.io/benfleis/ducktest-unitycatalog:ci
    steps:
      - uses: actions/checkout@v4 # test files + pyproject + scripts; binary comes from the artifact

      - name: Download the test binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_KIND }}
          path: build/${{ env.BUILD_KIND }}

      # upload-artifact drops the executable bit; restore it on the two binaries (extensions are LOADed, not run).
      - name: Restore exec bits
        run: chmod +x build/$BUILD_KIND/test/unittest build/$BUILD_KIND/duckdb

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: pyproject.toml # TODO: uv.lock once stable

      - name: Pull OSS Unity Catalog image (fail fast if unpullable)
        run: docker pull "$DUCKTEST_UC_IMAGE"

      - name: Local suite (-m oss_local)
        run: BUILD_DIR=build/$BUILD_KIND uv run pytest -m oss_local -n0 -s

  # ---------------------------------------------------------------------------
  # Cloud: live Databricks. `environment: cloud` (required reviewer) gates each run -- an admin must
  # approve before the secrets are released, so a PR can request a Cloud run but only an admin authorizes
  # it. env_databricks is the SAME wrapper devs use locally.
  # ---------------------------------------------------------------------------
  cloud:
    name: Cloud (Databricks)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloud
    steps:
      - uses: actions/checkout@v4

      - name: Download the test binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_KIND }}
          path: build/${{ env.BUILD_KIND }}

      - name: Restore exec bits
        run: chmod +x build/$BUILD_KIND/test/unittest build/$BUILD_KIND/duckdb

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Cloud suite (-m databricks)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: BUILD_DIR=build/$BUILD_KIND scripts/env_databricks uv run pytest -m databricks -n0 -s
