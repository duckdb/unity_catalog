#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, "v[12].[0-9]+-[a-zA-Z]*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    name: Prepare
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@a68570fde10384547868301a12327d5c67909527 # main 2026-10-12 pin
    needs: prepare
    with:
      extension_name: &ext_name unity_catalog
      ci_tools_version: &ci_tools_ref a68570fde10384547868301a12327d5c67909527 # main 2026-10-12 pin
      runners: ${{ needs.prepare.outputs.runners }}
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64;linux_arm64;linux_amd64_musl
      enable_rust: true
      rust_logs: true
      use_merged_vcpkg_manifest: 1
      reduced_ci_mode: ${{ github.event_name == 'pull_request' && 'enabled' || 'disabled'}}

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@a68570fde10384547868301a12327d5c67909527 # main 2026-10-12 pin
    secrets: inherit
    with:
      extension_name: *ext_name
      ci_tools_version: *ci_tools_ref
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64;linux_arm64;linux_amd64_musl
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      reduced_ci_mode: ${{ github.event_name == 'pull_request' && 'enabled' || 'disabled'}}

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@a68570fde10384547868301a12327d5c67909527 # main 2026-10-12 pin
    with:
      extension_name: *ext_name
      ci_tools_version: *ci_tools_ref
      format_checks: format
      extra_toolchains: python3
