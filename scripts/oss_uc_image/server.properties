# Unity Catalog server config for the "duck" test image.
# Minimal on purpose: local filesystem only, no cloud credentials, no auth.

server.env=dev

# Auth off: single default principal, no tokens needed. Dev/CI only.
server.authorization=disable

# Managed tables must be enabled for the duck.cmt schema's catalog-managed
# (MANAGED) tables. duck.plain holds plain EXTERNAL tables.
server.managed-table.enabled=true

# No server-level storage-root.tables fallback is set on purpose. The cmt
# schema (duck.cmt) carries its own storage_root (.../etc/data/duck/cmt),
# so its catalog-managed tables (and UC's __unitystorage tree) land under it.
# External tables (duck.plain) bring their own location under the sibling
# .../etc/data/duck/plain -- not under/above cmt storage, so no external
# location needs to be registered.
